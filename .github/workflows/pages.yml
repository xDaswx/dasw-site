name: deploy-pages

on:
  push:
    branches: [ "main" ]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: deploy
        uses: actions/deploy-pages@v4
